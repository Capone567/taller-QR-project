<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Informes - Taller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .contenedor {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .grupo-input {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; 
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004494;
        }
        #resultado-qr {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Nuevo Informe de Distribución</h2>
        
        <form id="formulario-taller">
            <div class="grupo-input">
                <label for="patente">Patente del vehículo:</label>
                <input type="text" id="patente" placeholder="Ej: AB 123 CD" required>
            </div>

            <div class="grupo-input">
                <label for="kilometraje">Kilometraje actual:</label>
                <input type="number" id="kilometraje" placeholder="Ej: 60000" required>
            </div>

            <div class="grupo-input">
                <label for="fecha">Fecha de finalización:</label>
                <input type="date" id="fecha" required>
            </div>

            <button type="submit">Generar QR</button>
        </form>

        <div id="resultado-qr"></div>
    </div>

    <script>
        window.onload = function () {
            const inputFecha = document.getElementById('fecha');
            const hoy = new Date();
            const año = hoy.getFullYear();
            let mes = hoy.getMonth() + 1;
            let dia = hoy.getDate();

            if (mes < 10) mes = '0' + mes;
            if (dia < 10) dia = '0' + dia;

            inputFecha.value = `${año}-${mes}-${dia}`;
        };

        const formulario = document.getElementById('formulario-taller');

        formulario.addEventListener('submit', function (evento) {
            evento.preventDefault();

            const patente = document.getElementById('patente').value;
            const kilometraje = document.getElementById('kilometraje').value;
            const fechaIngresada = document.getElementById('fecha').value;

            const [año, mes, dia] = fechaIngresada.split('-');
            const fechaActualStr = `${dia}/${mes}/${año}`;

            const kmActual = parseInt(kilometraje);
            const kmProximo = kmActual + 50000;

            const urlBase = 'https://capone567.github.io/taller-QR-project/informe.html';

            const parametros = new URLSearchParams({
                pat: patente,
                km: kmActual,
                f_act: fechaActualStr,
                km_prox: kmProximo
            });

            const urlFinal = `${urlBase}?${parametros.toString()}`;
            const urlQR = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(urlFinal)}`;

            const contenedorQR = document.getElementById('resultado-qr');
            contenedorQR.innerHTML = `
                <hr style="border: 1px solid #ccc; margin: 20px 0;">
                <h3 style="color: #333;">QR Listo para Imprimir</h3>
                
                <button type="button" id="btn-descargar-qr" style="background-color: #28a745; margin-bottom: 15px;">⬇️ Descargar Etiqueta</button>
                <br>

                <img src="${urlQR}" alt="Código QR del Informe" style="border: 5px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-radius: 10px;">
                <p><strong>Patente:</strong> ${patente.toUpperCase()}</p>
                <p><strong>Próximo cambio a los:</strong> ${kmProximo.toLocaleString('es-AR')} km</p>
                <p><a href="${urlFinal}" target="_blank" style="color: #0056b3; text-decoration: none;">📄 Probar cómo se verá el informe</a></p>
            `;

            document.getElementById('btn-descargar-qr').addEventListener('click', function() {
                const btn = this;
                btn.innerText = "⏳ Generando Plantilla...";

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 400;
                canvas.height = 450;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#000000';
                ctx.textAlign = 'center';
                
                ctx.font = 'bold 24px Arial';
                ctx.fillText('TALLER SOLO DISTRIBUCION', 200, 50);
                
                ctx.font = 'bold 18px Arial';
                ctx.fillText(`Patente: ${patente.toUpperCase()}`, 200, 85);

                const imgQR = new Image();
                imgQR.crossOrigin = "Anonymous";
                imgQR.src = urlQR;
                
                imgQR.onload = function() {
                    ctx.drawImage(imgQR, 75, 120, 250, 250);
                    
                    ctx.font = '14px Arial';
                    ctx.fillStyle = '#555555';
                    ctx.fillText('Escaneá para ver el informe digital', 200, 410);

                    canvas.toBlob(function(blob) {
                        const urlBlob = window.URL.createObjectURL(blob);
                        const linkFalso = document.createElement('a');
                        linkFalso.style.display = 'none';
                        linkFalso.href = urlBlob;
                        linkFalso.download = `Etiqueta_${patente.toUpperCase().replace(/\s/g, '')}.png`;
                        
                        document.body.appendChild(linkFalso);
                        linkFalso.click();
                        
                        window.URL.revokeObjectURL(urlBlob);
                        document.body.removeChild(linkFalso);
                        
                        btn.innerText = "⬇️ Descargar Etiqueta";
                    }, 'image/png');
                };

                imgQR.onerror = function() {
                    alert("Hubo un error al generar la plantilla. Intentá de nuevo.");
                    btn.innerText = "⬇️ Descargar Etiqueta";
                };
            });
        });
    </script>
</body>
</html>
