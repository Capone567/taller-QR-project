<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe de Distribución - Taller</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .tarjeta {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .cabecera {
            background-color: #1a1a1a; 
            color: #ffffff;
            text-align: center;
            padding: 0; 
        }
        
        .cabecera img {
            width: 100%; 
            height: auto; 
            display: block; 
            border-top-left-radius: 15px; 
            border-top-right-radius: 15px;
        }
        
        .cabecera h1 {
            margin: 0;
            padding: 15px 10px; 
            font-size: 22px;
            letter-spacing: 1px;
        }
        .contenido {
            padding: 25px;
        }
        .dato-grupo {
            margin-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .dato-grupo:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .etiqueta {
            font-size: 14px;
            color: #777;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        .valor {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }
        .alerta {
            color: #d9534f; 
            font-size: 20px;
        }
        .redes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .btn {
            display: block;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-whatsapp { background-color: #25D366; }
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-facebook { background-color: #1877F2; }
    </style>
</head>
<body>

    <div class="tarjeta">
        <div class="cabecera">
            <img src="/img/logoSd.jpg" alt="Logo del Taller">
            <h1>TALLER DISTRIBUCIONES</h1>
        </div>

        <div class="contenido">
            <div class="dato-grupo">
                <span class="etiqueta">Vehículo (Patente)</span>
                <span class="valor" id="vista-patente">Cargando...</span>
            </div>

            <div class="dato-grupo">
                <span class="etiqueta">Kilometraje de Servicio</span>
                <span class="valor" id="vista-km">Cargando...</span> <span class="valor">km</span>
            </div>

            <div class="dato-grupo">
                <span class="etiqueta">Fecha del Trabajo</span>
                <span class="valor" id="vista-fecha-act">Cargando...</span>
            </div>

            <div class="dato-grupo">
                <span class="etiqueta" style="color: #d9534f;">Próximo Cambio de Distribución</span>
                <span class="valor alerta" id="vista-km-prox">Cargando...</span> <span class="valor alerta">km</span>
            </div>
        </div>
    </div>

    <div class="redes">
        <a href="https://wa.me/5491100000000" class="btn btn-whatsapp" target="_blank">Contactar por WhatsApp</a>
        <a href="https://instagram.com/tutaller" class="btn btn-instagram" target="_blank">Seguinos en Instagram</a>
        <a href="https://facebook.com/tutaller" class="btn btn-facebook" target="_blank">Nuestro Facebook</a>
    </div>

    <script>
        const parametrosURL = new URLSearchParams(window.location.search);

        const patente = parametrosURL.get('pat') || 'No disponible';
        const kilometraje = parametrosURL.get('km') || '0';
        const fechaActual = parametrosURL.get('f_act') || '--/--/----';
        const kmProximo = parametrosURL.get('km_prox') || '0';

        document.getElementById('vista-patente').textContent = patente.toUpperCase();
        document.getElementById('vista-km').textContent = Number(kilometraje).toLocaleString('es-AR');
        document.getElementById('vista-fecha-act').textContent = fechaActual;
        document.getElementById('vista-km-prox').textContent = Number(kmProximo).toLocaleString('es-AR');
    </script>

</body>
</html>
